<script>
const knapp=document.getElementById('knapp'), status=document.getElementById('status'), sig=document.getElementById('sig');
function markera(){const r=document.createRange(); r.selectNodeContents(sig); const s=window.getSelection(); s.removeAllRanges(); s.addRange(r);}
knapp.addEventListener('click', async ()=>{
  const html=sig.innerHTML, text=sig.innerText;
  try {
    await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);
    status.textContent='\u2713 Kopierad! G\u00e5 till Inst\u00e4llningar \u2192 Appar \u2192 Mail \u2192 Signatur och klistra in.';
  } catch(e) {
    markera(); let ok=false; try{ok=document.execCommand('copy');}catch(_){}
    status.textContent= ok ? '\u2713 Kopierad! Klistra in under Inst\u00e4llningar \u2192 Appar \u2192 Mail \u2192 Signatur.' : 'Signaturen \u00e4r markerad \u2013 tryck p\u00e5 Kopiera.';
  }
});
